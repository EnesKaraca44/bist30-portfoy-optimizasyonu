<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Portföy Robotu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--card);
            width: 100%;
            max-width: 440px;
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .logo-icon {
            font-size: 2.5em;
            margin-bottom: 16px;
            display: inline-block;
        }

        .header h1 {
            font-size: 1.75em;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 1em;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.25);
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-to-site {
            display: inline-block;
            margin-top: 24px;
            font-size: 0.85em;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-to-site:hover {
            color: var(--text-main);
        }

        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
        }

        .msg-error {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .msg-success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #dcfce7;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="header">
            <span class="logo-icon">🔒</span>
            <h1>Hesabınıza Giriş Yapın</h1>
            <p>Portföy robotuna erişmek için bilgilerinizi girin</p>
        </div>

        {% if error %}
        <div class="msg msg-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="msg msg-success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" required placeholder="isim@sirket.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    autocomplete="current-password">
            </div>

            <button type="submit" class="submit-btn">Giriş Yap</button>
        </form>

        <div class="auth-footer">
            Henüz bir hesabınız yok mu? <a href="/register">Hemen Kaydolun</a>
            <br>
            <a href="/" class="back-to-site">← Ana Sayfaya Dön</a>
        </div>
    </div>
</body>

</html>
